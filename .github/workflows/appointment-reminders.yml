# Pings Orbit's /api/cron/appointment-reminders endpoint.
#
# SUPERSEDED as the automatic trigger by Supabase pg_cron (see
# supabase/migrations/015_appointment_reminder_pgcron.sql) - GitHub's
# scheduled-workflow trigger turned out to fire hours apart instead of every
# 5 minutes (confirmed via this workflow's own run history), which is
# useless for catching 60/30/5-minute-before windows. pg_cron runs inside
# Postgres itself and isn't subject to that throttling.
#
# The `schedule` trigger below is intentionally removed so this doesn't
# double-send reminders alongside pg_cron. Kept only for manual testing via
# the "Actions" tab -> this workflow -> "Run workflow" button.
#
# (Original one-time setup, still relevant for manual runs: APP_URL and
# CRON_SECRET repo secrets, with CRON_SECRET matching Vercel's env var of
# the same name.)

name: Appointment reminders

on:
  workflow_dispatch: {}   # manual runs only - see note above

# Keep the workflow lightweight; we don't need permissions to anything in the repo
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # 2-minute hard cap - the API endpoint should respond in <5s; if it hangs
    # we want this job to die quickly so the next 5-min slot can run fresh.
    timeout-minutes: 2

    steps:
      - name: Ping reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not set. Add it in repo Settings -> Secrets."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set. Add it in repo Settings -> Secrets AND in Vercel env vars."
            exit 1
          fi

          # Hit the endpoint. Print body for debugging, fail the job on non-2xx
          # so the failure shows up in the Actions tab.
          curl --silent --show-error --fail \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/appointment-reminders"
